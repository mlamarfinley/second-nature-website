    <meta name="description" content="We build the AI receptionist that answers your phone 24/7, books the job, and texts back every missed call — plus the automations and custom software behind it. Call ours: (470) 748-9278." />
    <meta name="theme-color" content="#050505" />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <link rel="preload" as="image" imagesrcset="./hero-800.webp 800w, ./hero-1456.webp 1456w" imagesizes="100vw" type="image/webp" />

    <!-- Fonts are self-hosted. They used to come from fonts.googleapis.com:
         a render-blocking stylesheet on a third-party origin, plus a second
         origin for the files, and every visitor's IP handed to Google before
         first paint — which a German court ruled a GDPR violation in 2022,
         on a site that had no privacy policy disclosing it. Preloading the
         two faces that paint above the fold. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/schibsted-grotesk-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="/fonts/playfair-display-latin-500-normal.woff2" />

    <!-- Canonical and share tags now point at the domain the business owns.
         They used to point at a personal github.io subdomain, which told
         Google that address was the real site. -->
    <link rel="canonical" href="https://aisecondnature.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Second Nature" />

    <meta property="og:image:width" content="1200" />
